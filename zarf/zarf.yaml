# zarf.yaml
kind: ZarfPackageConfig
metadata:
  name: harvester-provisioner
  description: "A Zarf package to deploy a single-node Harvester cluster on HPE iLO-managed hardware."
  version: "v0.0.1-dev1"

# This constant is set at package CREATE time.
constants:
  - name: HARVESTER_VERSION
    value: "###ZARF_PKG_TMPL_HARVESTER_VERSION###" # Default to v1.3.0 if not provided
    description: "The version of Harvester to download and package (e.g., v1.3.0)"

# This 'variables' block defines all user-configurable values at DEPLOY time.
variables:
  - name: K3S_HOST_IP
    description: "The IP address of the machine which running the k3s cluster."
    prompt: true
  - name: CLUSTER_NAME
    description: "The name for the Harvester cluster resource."
    default: "my-harvester"
  # Network Settings
  - name: NODE_IP
    description: "The static IP address for the Harvester node."
    prompt: true
  - name: HARVESTER_VIP
    description: "The virtual IP address for the Harvester cluster."
    prompt: true
  - name: NETWORK_GATEWAY
    description: "The network gateway address."
    prompt: true
  - name: NETWORK_NETMASK
    description: "The network subnet mask (e.g., 255.255.255.0)."
    prompt: true
  # Node Hardware Settings
  - name: NODE_NAME
    description: "The name for the Harvester node and its inventory resource."
    default: "harvester-node-01"
  - name: NODE_MAC
    description: "The MAC address of the node's management interface."
    prompt: true
  # HPE iLO Specific Settings
  - name: ILO_IP
    description: "The IP address of the node's HPE iLO interface."
    prompt: true
  - name: ILO_PORT
    description: "The port for the node's iLO Redfish interface."
    default: "443"
  - name: ILO_USERNAME
    description: "The username for the iLO interface."
    prompt: true
  - name: ILO_PASSWORD
    description: "The password for the iLO interface."
    prompt: true
    sensitive: true

components:
  - name: nginx
    description: "Downloads the Harvester ISO and deploys an Nginx server to host it."
    manifests:
      - name: nginx-manifests
        namespace: nginx
        files:
          - ./manifests/nginx.yaml
    images:
      - bash
      - nginx:1.25.1
    actions:
      onDeploy:
        before:
          - description: "Check that the Harvester ISO exists on the host filesystem before deploying"
            cmd: |
              echo "🔎 Verifying prerequisite ISO file exists at /opt/hci-provisioner/web/iso..."
              if test -f "/opt/hci-provisioner/web/iso/harvester-###ZARF_PKG_TMPL_HARVESTER_VERSION###-amd64.iso"; then
                echo "✅ Prerequisite ISO found."
              else
                echo "❌ ERROR: Prerequisite ISO not found!"
                exit 1
              fi
        after:
          - description: "Wait for the Harvester ISO to be available from the Nginx server"
            wait:
              cluster:
                kind: Deployment
                name: nginx-deployment
                namespace: nginx
                condition: Available

          - description: "Wait for the Harvester ISO to be available from the Nginx server"
            wait:
              network:
                protocol: http
                address: localhost:32200/version-###ZARF_PKG_TMPL_HARVESTER_VERSION###.yaml
                code: 200
                

  - name: seeder
    required: true
    description: "Deploys Harvester Seeder and the full Tinkerbell stack."
    charts:
      - name: harvester-seeder
        namespace: seeder-system
        localPath: ../chart/seeder
        version: 0.0.1-dev
        valuesFiles:
          # This file will be templated by Zarf at deploy time with the constant and variable values
          - ./values/seeder.yaml
    images:
      - bash
      - nginx:1.25.1
      - quay.io/tinkerbell/hegel:v0.11.1
      - quay.io/tinkerbell/rufio:v0.3.2
      - quay.io/tinkerbell/smee:v0.10.1
      - quay.io/tinkerbell/tink-controller:v0.9.0
      - quay.io/tinkerbell/tink:v0.9.0
      - rancher/harvester-seeder:###ZARF_PKG_TMPL_HARVESTER_VERSION###
      - quay.io/tinkerbell/tink-worker:v0.9.0


  - name: hci
    required: true
    description: "Deploys the templated Harvester cluster definition."
    manifests:
      - name: ilo-secret
        namespace: seeder-system
        files:
          - ./manifests/ilo-secret.yaml
      - name: hci-definition
        namespace: seeder-system
        files:
          - ./manifests/hci.yaml
